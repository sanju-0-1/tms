
services:
  database:
    image: bitnami/mongodb:6.0
    container_name: tms-mongodb
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build: ./backend
    container_name: tms-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://database:27017/full_tms
      - JWT_SECRET=my_super_secret_key_123
      - JWT_EXPIRY=7d
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=http://localhost:5000/api
    container_name: tms-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
